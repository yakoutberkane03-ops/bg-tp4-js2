<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Etape 2 - Insertion</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div id="form_container">
      <div class="form_group">
        <label class="form_label">Nom:</label>
        <input type="text" id="form_nom" class="form_field" />
      </div>

      <div class="form_group">
        <label class="form_label">Prénom:</label>
        <input type="text" id="form_prenom" class="form_field" />
      </div>

      <div class="form_group">
        <label class="form_label">Points:</label>
        <input type="number" id="form_points" class="form_field" />
      </div>

      <button class="btn_add" onclick="doNewData()">Ajouter</button>
    </div>
    <div id="table_container">
      <table>
        <thead>
          <tr>
            <th class="col_number">N°</th>
            <th class="col_text">Nom</th>
            <th class="col_text">Prénom</th>
            <th class="col_number">Points</th>
            <th class="col_chkbox">Select</th>
          </tr>
        </thead>

        <tbody></tbody>
      </table>

      <div id="container_summary">
        <p id="p1">0 ligne(s)</p>
        <p id="p2"></p>
        <p id="p3">Total point(s)= 0</p>
      </div>
      <div id="container_btn">
        <button class="btn_consol" onclick="consoleTableau()">console tableau</button>
        <button class="btn_del" onclick="deleteRow()">Supprimer</button>
      </div>
        <div id="extra_buttons">
        <button onclick="selectAllRows()">Tout sélectionner</button>
        <button onclick="deselectAllRows()">Tout désélectionner</button>
        <button onclick="resetTable()">Réinitialiser la liste</button>
    </div>
    </div>
  </body>
</html>
